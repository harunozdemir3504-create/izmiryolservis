<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>İzmir Yol Servis – Konuşmalı Reels Stüdyosu (Pro & Akıcı)</title>
<style>
  html, body { margin: 0; background: #07090e; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px; }
  canvas { height: 86vh; aspect-ratio: 9 / 16; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.8); background: #000; }
  .btns { display: flex; gap: 12px; }
  button { font: 700 15px 'Segoe UI'; padding: 12px 24px; border-radius: 12px; border: 0; cursor: pointer; transition: transform .15s; }
  button:hover { transform: scale(1.03); }
  #play { background: linear-gradient(90deg,#f97316,#f59e0b); color: #000; }
  #rec { background: #10b981; color: #fff; }
  #status { font-size: 14px; color: #94a3b8; font-weight: 600; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="720" height="1280"></canvas>
  <div class="btns">
    <button id="play">▶ Önizle (Sesli & Akıcı)</button>
    <button id="rec">⬇ MP4 Olarak Kaydet</button>
  </div>
  <div id="status">Hazır.</div>
</div>
<script src="video-assets/assets.js"></script>
<script>
'use strict';
const W = 720, H = 1280;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const FONT = "'Segoe UI', 'Segoe UI Emoji', system-ui, sans-serif";
const C = { orange: '#f97316', amber: '#f59e0b', red: '#ef4444', green: '#10b981', dark: '#0b0f19' };

// ======================================================================
// 1) LOAD IMAGES
// ======================================================================
const IMG = {};
function loadImages() {
  return Promise.all(Object.entries(ASSETS.img).map(([k, src]) => new Promise((res, rej) => {
    const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = rej; im.src = src;
  })));
}

// ======================================================================
// 2) DIALOGUE SCRIPT & TIMINGS (Natural Turkish, Zero Pitch Shift)
// ======================================================================
const SPEAKERS = {
  E: { name: 'EMRE', color: '#f59e0b', text: '#000' },
  M: { name: 'MERT', color: '#10b981', text: '#000' }
};

const LINES = [
  { id: 'd1_emre', sp: 'E', start: 0.8, dur: 3.12, end: 3.92,
    cap: 'Of ya... Offff. 😮‍💨', hi: ['Offff.'] },
  { id: 'd2_mert', sp: 'M', start: 4.4, dur: 3.85, end: 8.25,
    cap: 'Ne oldu kanka? Niye öyle ofluyorsun?', hi: ['kanka?', 'ofluyorsun?'] },
  { id: 'd3_emre', sp: 'E', start: 8.8, dur: 11.32, end: 20.12,
    cap: 'Sorma kanka. İşler çok yoğun. Arabanın bakımı geldi ama sanayiye gidemiyorum. Sıra bekleyecek vaktim yok.',
    hi: ['yoğun.', 'bakımı', 'sanayiye', 'vaktim', 'yok.'] },
  { id: 'd4_mert', sp: 'M', start: 20.8, dur: 12.97, end: 33.77,
    cap: 'Bak oğlum! izmiryolservis.com.tr sitesine gir. Belgeli ustalar 15 dakikada kapında! Uygun fiyata kaliteli hizmet, yerinde tamir ve bakım yapıyorlar.',
    hi: ['izmiryolservis.com.tr', 'Belgeli', '15', 'dakikada', 'kapında!', 'Uygun', 'tamir'] },
  { id: 'd5_emre', sp: 'E', start: 34.5, dur: 4.67, end: 39.17,
    cap: 'Ciddi misin? Valla süper, hemen giriyorum! 👍', hi: ['süper,', 'hemen'] }
];

const END_START = 39.2;
const TOTAL = 44.0;

// Layout words
LINES.forEach(l => {
  const words = l.cap.split(' ');
  const durPerWord = l.dur / words.length;
  l.words = words.map((w, i) => ({
    w,
    t: l.start + i * durPerWord,
    hi: l.hi.some(h => w.includes(h))
  }));
});

// ======================================================================
// 3) SCENE SHOTS (Fast & Cinematic)
// ======================================================================
const SHOTS = [
  { img: 's01', a: 0.0, b: 0.8, kb: [1.08, 1.02, .5, .45] },
  { img: 's02', a: 0.8, b: 4.4, kb: [1.00, 1.12, .5, .38] },
  { img: 's03', a: 4.4, b: 8.8, kb: [1.02, 1.14, .5, .40] },
  { img: 's04', a: 8.8, b: 13.5, kb: [1.12, 1.03, .5, .42] },
  { img: 's06', a: 13.5, b: 16.8, kb: [1.00, 1.15, .5, .50] }, // dashboard wrench light
  { img: 's05', a: 16.8, b: 20.8, kb: [1.14, 1.04, .45, .50] }, // sanayi queue
  { img: 's07', a: 20.8, b: 22.8, kb: [1.00, 1.10, .5, .40] }, // mert suggests
  { phone: true, a: 22.8, b: 27.5 },                           // interactive phone
  { img: 's08', a: 27.5, b: 30.8, kb: [1.12, 1.02, .5, .50] }, // mechanic arrives
  { img: 's09', a: 30.8, b: 34.5, kb: [1.02, 1.12, .5, .48] }, // mechanic working
  { img: 's10', a: 34.5, b: END_START, kb: [1.04, 1.14, .5, .42] }, // happy emre
  { end: true, a: END_START, b: TOTAL + 1 }
];

const BADGES = [
  { a: 25.5, b: 28.5, y: 320, icon: '⏱️', text: '15 Dakikada Kapında', col: C.orange },
  { a: 28.5, b: 31.5, y: 320, icon: '🛡️', text: 'Belgeli Uzman Usta', col: C.green },
  { a: 31.5, b: 34.5, y: 320, icon: '💸', text: 'Uygun Fiyat & Kalite', col: C.amber }
];

// ======================================================================
// 4) ULTRA-FAST DRAW HELPERS (No CPU Blur, No Heavy Lag)
// ======================================================================
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, x) => a + (b - a) * x;

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawCover(im, scale, fx, fy, alpha = 1) {
  if (!im) return;
  const ir = im.width / im.height, cr = W / H;
  let dw, dh;
  if (ir > cr) { dh = H * scale; dw = dh * ir; } else { dw = W * scale; dh = dw / ir; }
  const cx = W / 2 - (fx - 0.5) * (dw - W) - dw / 2;
  const cy = H / 2 - (fy - 0.5) * (dh - H) - dh / 2;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(im, clamp(cx, W - dw, 0), clamp(cy, H - dh, 0), dw, dh);
  ctx.restore();
}

function drawShotImage(s, time, alpha) {
  const p = clamp((time - s.a) / (s.b - s.a));
  const e = ease(p);
  const sc = lerp(s.kb[0], s.kb[1], e);
  drawCover(IMG[s.img], sc, s.kb[2], s.kb[3], alpha);
}

// Pre-render vignette gradient once
const vignette = document.createElement('canvas');
vignette.width = W; vignette.height = H;
(() => {
  const g = vignette.getContext('2d');
  const bot = g.createLinearGradient(0, H * 0.52, 0, H);
  bot.addColorStop(0, 'rgba(0,0,0,0)');
  bot.addColorStop(1, 'rgba(0,0,0,0.85)');
  g.fillStyle = bot; g.fillRect(0, H * 0.52, W, H * 0.48);
  const top = g.createLinearGradient(0, 0, 0, 260);
  top.addColorStop(0, 'rgba(0,0,0,0.65)');
  top.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = top; g.fillRect(0, 0, W, 260);
})();

function textShadowed(str, x, y, size, color = '#fff', weight = 900, align = 'center') {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.round(size * 0.16);
  ctx.strokeStyle = '#000';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

// ======================================================================
// 5) CAPTIONS & SUBTITLES
// ======================================================================
function drawCaption(time) {
  const l = LINES.find(x => time >= x.start && time <= x.end + 0.35);
  if (!l) return;
  const inP = easeOut(clamp((time - l.start) / 0.15));
  const outP = clamp((time - l.end) / 0.35);
  const alpha = inP * (1 - outP);

  ctx.save();
  ctx.globalAlpha = alpha;

  // Speaker Tag
  const sp = SPEAKERS[l.sp];
  const tagY = 880;
  ctx.font = `900 26px ${FONT}`;
  const tw = ctx.measureText(sp.name).width;
  ctx.fillStyle = sp.color;
  rr(W / 2 - (tw + 48) / 2, tagY - 22, tw + 48, 44, 22);
  ctx.fill();
  ctx.fillStyle = sp.text;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(sp.name, W / 2, tagY + 1);

  // Subtitle words (2-3 lines clean wrap)
  const fontSize = l.cap.length > 50 ? 40 : 46;
  ctx.font = `900 ${fontSize}px ${FONT}`;
  const maxW = 620, spaceW = ctx.measureText(' ').width;
  const rows = [[]]; let curW = 0;
  l.words.forEach((wd, i) => {
    const w = ctx.measureText(wd.w).width;
    if (curW + w > maxW && rows[rows.length - 1].length) { rows.push([]); curW = 0; }
    rows[rows.length - 1].push({ i, w });
    curW += w + spaceW;
  });

  const lineH = fontSize * 1.25;
  const startY = 960;
  rows.forEach((row, ri) => {
    const rowW = row.reduce((a, b) => a + b.w, 0) + (row.length - 1) * spaceW;
    let x = W / 2 - rowW / 2;
    const y = startY + ri * lineH;
    row.forEach(item => {
      const wd = l.words[item.i];
      const active = time >= wd.t;
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#000';
      ctx.strokeText(wd.w, x + item.w / 2, y);
      ctx.fillStyle = active ? (wd.hi ? (l.sp === 'E' ? '#fbbf24' : '#34d399') : '#ffffff') : 'rgba(255,255,255,0.6)';
      ctx.fillText(wd.w, x + item.w / 2, y);
      x += item.w + spaceW;
    });
  });

  ctx.restore();
}

// ======================================================================
// 6) INTERACTIVE PHONE MOCKUP (Lightweight, No Blur, Zero Lag)
// ======================================================================
const URL_TXT = 'izmiryolservis.com.tr';
function drawPhone(time, alpha) {
  // Dark backdrop
  drawCover(IMG.s07, 1.05, .5, .4, alpha);
  ctx.fillStyle = 'rgba(11,15,25,0.78)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalAlpha = alpha;
  const pIn = easeOut(clamp((time - 22.8) / 0.45));
  const PW = 440, PH = 880;
  const px = W / 2 - PW / 2, py = 160 + (1 - pIn) * 180;

  // Phone Frame
  ctx.fillStyle = '#111827';
  rr(px - 10, py - 10, PW + 20, PH + 20, 50);
  ctx.fill();
  ctx.strokeStyle = '#374151';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Screen
  ctx.save();
  rr(px, py, PW, PH, 42);
  ctx.clip();
  ctx.fillStyle = '#0b0f19';
  ctx.fillRect(px, py, PW, PH);

  // Address Bar
  const by = py + 48;
  ctx.fillStyle = '#1f2937';
  rr(px + 16, by, PW - 32, 52, 26);
  ctx.fill();

  const typeP = clamp((time - 23.0) / 1.6);
  const numChars = Math.floor(typeP * URL_TXT.length);
  const typed = URL_TXT.slice(0, numChars);
  ctx.font = `600 22px ${FONT}`;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.fillText('🔒 ' + (typed || 'izmiryolservis...'), px + 36, by + 28);

  // Website Content
  if (time > 24.8) {
    const cy = by + 68;
    // Red Emergency Top Bar
    ctx.fillStyle = '#dc2626';
    ctx.fillRect(px, cy, PW, 34);
    ctx.fillStyle = '#fff';
    ctx.font = `800 14px ${FONT}`;
    ctx.fillText('● 7/24 İZMİR YOL YARDIM & MOBİL SERVİS', px + 18, cy + 18);

    // Header
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(px, cy + 34, PW, 64);
    ctx.fillStyle = C.orange;
    rr(px + 16, cy + 46, 40, 40, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `24px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('🔧', px + 36, cy + 68);

    ctx.textAlign = 'left';
    ctx.font = `900 20px ${FONT}`;
    ctx.fillText('İzmir Yol Servis', px + 68, cy + 60);
    ctx.fillStyle = C.amber;
    ctx.font = `700 13px ${FONT}`;
    ctx.fillText('7/24 Mobil Araç Bakım & Çekici', px + 68, cy + 80);

    // Hero Section
    const hy = cy + 98;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(px, hy, PW, 320);

    // Hero image
    if (IMG.usta) {
      ctx.drawImage(IMG.usta, px, hy, PW, 170);
      const hg = ctx.createLinearGradient(0, hy + 60, 0, hy + 170);
      hg.addColorStop(0, 'transparent');
      hg.addColorStop(1, '#1e293b');
      ctx.fillStyle = hg;
      ctx.fillRect(px, hy + 60, PW, 110);
    }

    ctx.fillStyle = '#fff';
    ctx.font = `900 24px ${FONT}`;
    ctx.fillText('İzmir Yol Yardım &', px + 20, hy + 200);
    ctx.fillStyle = C.amber;
    ctx.fillText('Mobil Oto Servis', px + 20, hy + 230);

    // Buttons
    const by2 = hy + 250;
    ctx.fillStyle = '#ea580c';
    rr(px + 20, by2, 190, 50, 14);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `800 16px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('📞 Hemen Ara', px + 115, by2 + 26);

    ctx.fillStyle = '#10b981';
    rr(px + PW - 210, by2, 190, 50, 14);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText('📍 Konum Gönder', px + PW - 115, by2 + 26);
  }

  ctx.restore(); // clip
  ctx.restore();
}

// ======================================================================
// 7) BADGES & WATERMARK
// ======================================================================
function drawBadges(time) {
  BADGES.forEach(bg => {
    if (time >= bg.a && time <= bg.b) {
      const p = easeOut(clamp((time - bg.a) / 0.3));
      const out = clamp((time - (bg.b - 0.2)) / 0.2);
      ctx.save();
      ctx.globalAlpha = p * (1 - out);
      ctx.font = `900 34px ${FONT}`;
      const tw = ctx.measureText(bg.text).width;
      const bw = tw + 100, x = W / 2 - bw / 2;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      rr(x, bg.y, bw, 68, 34);
      ctx.fill();
      ctx.fillStyle = bg.col;
      ctx.beginPath();
      ctx.arc(x + 36, bg.y + 34, 24, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = `28px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(bg.icon, x + 36, bg.y + 36);
      ctx.font = `900 30px ${FONT}`;
      ctx.fillStyle = '#0b0f19';
      ctx.textAlign = 'left';
      ctx.fillText(bg.text, x + 72, bg.y + 36);
      ctx.restore();
    }
  });
}

function drawWatermark(time) {
  if (time > END_START) return;
  ctx.save();
  ctx.font = `800 22px ${FONT}`;
  const txt = 'izmiryolservis.com.tr';
  const w = ctx.measureText(txt).width + 60;
  ctx.fillStyle = 'rgba(11,15,25,0.7)';
  rr(W / 2 - w / 2, 70, w, 44, 22);
  ctx.fill();
  ctx.strokeStyle = C.orange;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = C.orange;
  ctx.beginPath();
  ctx.arc(W / 2 - w / 2 + 22, 92, 6, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, W / 2 - w / 2 + 38, 93);
  ctx.restore();
}

// ======================================================================
// 8) END CARD
// ======================================================================
function drawEnd(time) {
  const p = time - END_START;
  drawCover(IMG.s09, 1.05, .5, .5, 1);
  ctx.fillStyle = 'rgba(11,15,25,0.92)';
  ctx.fillRect(0, 0, W, H);

  // Logo
  const s = easeOut(clamp(p / 0.4));
  ctx.save();
  ctx.translate(W / 2, 340);
  ctx.scale(s, s);
  const lg = ctx.createLinearGradient(-70, -70, 70, 70);
  lg.addColorStop(0, C.orange); lg.addColorStop(1, C.amber);
  ctx.fillStyle = lg;
  rr(-70, -70, 140, 140, 36);
  ctx.fill();
  ctx.fillStyle = '#0b0f19';
  rr(-60, -60, 120, 120, 30);
  ctx.fill();
  ctx.font = `74px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🔧', 0, 4);
  ctx.restore();

  textShadowed('İZMİR YOL SERVİS', W / 2, 470, 56, '#fff', 900);
  textShadowed('7/24 Mobil Oto Servis & Yol Yardım', W / 2, 530, 26, '#fbbf24', 700);

  // Website Pill
  const pulse = 1 + 0.02 * Math.sin(p * 5);
  ctx.save();
  ctx.translate(W / 2, 630);
  ctx.scale(pulse, pulse);
  const ug = ctx.createLinearGradient(-260, 0, 260, 0);
  ug.addColorStop(0, '#ea580c'); ug.addColorStop(1, '#f59e0b');
  ctx.fillStyle = ug;
  rr(-260, -42, 520, 84, 42);
  ctx.fill();
  textShadowed('🌐 izmiryolservis.com.tr', 0, 4, 34, '#fff', 900);
  ctx.restore();

  // Phone Callout
  textShadowed('📞 0536 429 08 61', W / 2, 740, 44, '#fff', 900);

  // Checklist
  const items = [
    '✅  Belgeli Uzman Ustalar',
    '⏱️  15 Dakikada Kapında',
    '💸  Uygun Fiyat & Garantili İşçilik',
    '🔧  Kapıda Periyodik Bakım & Tamir'
  ];
  items.forEach((it, i) => {
    ctx.font = `800 26px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#e2e8f0';
    ctx.fillText(it, 140, 830 + i * 50);
  });

  // Action CTA Button
  const ctaY = 1080;
  ctx.fillStyle = '#10b981';
  rr(W / 2 - 250, ctaY - 32, 500, 64, 32);
  ctx.fill();
  textShadowed('Hemen Ara ya da WhatsApp\'tan Yaz!', W / 2, ctaY + 2, 24, '#fff', 800);
}

// ======================================================================
// 9) FRAME RENDER (Takes ~1.5ms per frame)
// ======================================================================
function render(time) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Active shot
  for (let i = 0; i < SHOTS.length; i++) {
    const s = SHOTS[i];
    if (time >= s.a && time < s.b) {
      if (s.end) drawEnd(time);
      else if (s.phone) drawPhone(time, 1);
      else drawShotImage(s, time, 1);
      break;
    }
  }

  if (time < END_START) {
    ctx.drawImage(vignette, 0, 0);
    drawWatermark(time);
    drawBadges(time);
    drawCaption(time);
  }

  // Fade out at end
  if (time > TOTAL - 0.4) {
    ctx.fillStyle = `rgba(0,0,0,${clamp((time - (TOTAL - 0.4)) / 0.4)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ======================================================================
// 10) PLAYBACK & RECORDING
// ======================================================================
let running = false;
async function start(record) {
  if (running) return;
  running = true;
  await loadImages();

  // Load clean master soundtrack WAV
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const rawWav = atob(ASSETS.soundtrack);
  const ab = new ArrayBuffer(rawWav.length);
  const u8 = new Uint8Array(ab);
  for (let i = 0; i < rawWav.length; i++) u8[i] = rawWav.charCodeAt(i);
  const audioBuffer = await ac.decodeAudioData(ab);

  const dest = ac.createMediaStreamDestination();
  const sourceNode = ac.createBufferSource();
  sourceNode.buffer = audioBuffer;
  sourceNode.connect(dest);
  if (!record) sourceNode.connect(ac.destination);

  let rec = null, chunks = [], mime = '';
  if (record) {
    const vs = canvas.captureStream(30);
    const stream = new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
    mime = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  }

  sourceNode.start(0);
  const t0 = performance.now();
  if (record) rec.start(250);

  return new Promise(resolve => {
    let slowFrames = 0;
    function loop() {
      const now = performance.now();
      const tt = (now - t0) / 1000;
      const frameStart = performance.now();
      render(tt);
      if (performance.now() - frameStart > 33) slowFrames++;

      document.getElementById('status').textContent = `${tt.toFixed(1)} / ${TOTAL.toFixed(1)} sn (Akıcı 30 FPS)`;

      if (tt >= TOTAL) {
        running = false;
        sourceNode.stop();
        if (record) {
          rec.onstop = () => {
            const blob = new Blob(chunks, { type: mime });
            window.__RESULT = { blob, mime, slowFrames, total: TOTAL };
            resolve(window.__RESULT);
          };
          rec.stop();
        } else resolve({ slowFrames });
        return;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  });
}

window.__getChunk = async (i, size) => {
  const b = window.__RESULT.blob.slice(i * size, (i + 1) * size);
  const buf = new Uint8Array(await b.arrayBuffer());
  let bin = '';
  for (let k = 0; k < buf.length; k += 32768) bin += String.fromCharCode.apply(null, buf.subarray(k, k + 32768));
  return btoa(bin);
};
window.__start = start;
window.__TOTAL = TOTAL;

document.getElementById('play').onclick = () => start(false);
document.getElementById('rec').onclick = async () => {
  const r = await start(true);
  const a = document.createElement('a');
